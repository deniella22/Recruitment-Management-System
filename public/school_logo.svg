<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Path for the top curved text: SISTERS OF MARY SCHOOL-GIRLSTOWN, INC. -->
    <!-- Arc from ~190 degrees clockwise to ~-10 degrees -->
    <path id="topTextArc" d="M 75,300 A 225,225 0 1,1 525,300" fill="none" />
    <!-- Path for the bottom curved text: ★ 1990 ★ -->
    <!-- Arc along bottom circle -->
    <path id="bottomTextArc" d="M 105,300 A 195,195 0 0,0 495,300" fill="none" />
  </defs>

  <rect width="600" height="600" fill="#FFFFFF" />

  <!-- Outer Ring Circle -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#0024E6" stroke-width="8" />

  <!-- Inner Ring Circle -->
  <circle cx="300" cy="300" r="225" fill="none" stroke="#0024E6" stroke-width="7" />

  <!-- Top Curved Text -->
  <text fill="#0024E6" font-family="'Arial Black', 'Helvetica Black', 'Impact', sans-serif" font-weight="900" font-size="28.5" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      SISTERS OF MARY SCHOOL-GIRLSTOWN, INC.
    </textPath>
  </text>

  <!-- Bottom Curved Text -->
  <text fill="#0024E6" font-family="'Arial Black', 'Helvetica Black', 'Impact', sans-serif" font-weight="900" font-size="34" letter-spacing="6">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ 1990 ★
    </textPath>
  </text>

  <!-- CENTRAL EMBLEM -->
  <g fill="#0024E6">
    <!-- Top Circle -->
    <circle cx="300" cy="200" r="46" />

    <!-- Center Lower Circle -->
    <circle cx="300" cy="340" r="46" />

    <!-- Horizontal Bar & Lower Semicircular Basin (Merged Union Silhouette) -->
    <!-- Bar top: y=230, Bar bottom: y=292, Left: x=115, Right: x=485 -->
    <!-- Semicircular Ring outer radius: 185, inner radius: 125 -->
    <path d="
      M 115,230
      L 485,230
      L 485,292
      A 185,185 0 0,1 115,292
      L 115,230
      Z
    " />
    <path d="
      M 115,300
      A 185,185 0 0,0 485,300
      L 425,300
      A 125,125 0 0,1 175,300
      L 115,300
      Z
    " fill="#0024E6" />
    
    <!-- Cutout inside bowl to match white background inside cradle -->
    <path d="
      M 175,292
      A 125,125 0 0,0 425,292
      L 425,292
      L 175,292
      Z
    " fill="#FFFFFF" />
  </g>
</svg>
